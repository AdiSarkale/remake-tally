name: Backend tenant isolation

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "feat/multi-company-tenant-architecture"

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run tests
        run: pytest -q
