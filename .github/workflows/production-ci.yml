name: Minitally CI

on:
  push:
    branches: ["main", "production", "phase-*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "production"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
      - name: Compile backend
        run: python -m compileall -q backend/app

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minitally
          POSTGRES_PASSWORD: minitally
          POSTGRES_DB: minitally
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minitally -d minitally"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Create isolated control database
        env:
          PGPASSWORD: minitally
        run: psql -h 127.0.0.1 -U minitally -d minitally -c "CREATE DATABASE minitally_control;"
      - name: Run control-plane migrations
        env:
          CONTROL_DATABASE_URL: postgresql+psycopg://minitally:minitally@127.0.0.1:5432/minitally_control
        run: alembic -c control_alembic.ini upgrade head
      - name: Run tenant migrations
        env:
          DATABASE_URL: postgresql+psycopg://minitally:minitally@127.0.0.1:5432/minitally
          CONTROL_DATABASE_URL: postgresql+psycopg://minitally:minitally@127.0.0.1:5432/minitally_control
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
