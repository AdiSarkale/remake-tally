name: Minitally CI

on:
  push:
    branches: ["main", "production", "phase-*", "feat/p0-hr-leave-payroll-authorization", "docs/hr-phase-2-implementation-status"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "production"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
      - name: Compile backend
        run: python -m compileall -q backend/app

  postgres-migrations:
    # Keep the runner's PostgreSQL client on the same major as the PostgreSQL 16
    # service. Newer pg_dump/pg_restore clients emit settings (for example
    # transaction_timeout) that PostgreSQL 16 does not understand.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minitally
          POSTGRES_PASSWORD: minitally
          POSTGRES_DB: minitally
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minitally -d minitally"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify PostgreSQL client compatibility
        run: |
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -Eq ' 16[.]'
          pg_restore --version | grep -Eq ' 16[.]'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Create isolated control database
        env:
          PGPASSWORD: minitally
        run: psql -h 127.0.0.1 -U minitally -d minitally -c "CREATE DATABASE minitally_control;"
      - name: Run control-plane migrations
        env:
          CONTROL_DATABASE_URL: postgresql+psycopg://minitally:minitally@127.0.0.1:5432/minitally_control
        run: alembic -c control_alembic.ini upgrade head
      - name: Run tenant migrations
        env:
          DATABASE_URL: postgresql+psycopg://minitally:minitally@127.0.0.1:5432/minitally
          CONTROL_DATABASE_URL: postgresql+psycopg://minitally:minitally@127.0.0.1:5432/minitally_control
        run: alembic upgrade head

      - name: Test PostgreSQL tenant provisioning lifecycle
        env:
          DATABASE_URL: postgresql+psycopg://minitally:minitally@127.0.0.1:5432/minitally
          CONTROL_DATABASE_URL: postgresql+psycopg://minitally:minitally@127.0.0.1:5432/minitally_control
          POSTGRES_TEST_ADMIN_URL: postgresql+psycopg://minitally:minitally@127.0.0.1:5432/minitally
        run: pytest -q tests/test_postgres_tenant_migrations.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies for live HR browser acceptance
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Start ephemeral SQLite API for live HR acceptance
        run: |
          PYTHONPATH=backend python backend/scripts/hr_p0_11_live_api_server.py > /tmp/p0-11-live-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p0-11-live-api.log
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright for browser smoke tests
        working-directory: frontend
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start frontend for browser smoke tests
        working-directory: frontend
        run: |
          VITE_API_URL=http://127.0.0.1:8000 npm run dev -- --host 0.0.0.0 > /tmp/nexora-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-vite.log
          exit 1
      - name: Verify employee, HR, Admin and Finance browser workflows (mock API smoke)
        working-directory: frontend
        run: node tests/e2e/smoke.mjs
      - name: Verify P0.1-11 HR workflows against live FastAPI + SQLite
        working-directory: frontend
        env:
          P0_11_LIVE_FRONTEND_URL: http://localhost:5173
        run: node tests/e2e/live-api-acceptance.mjs
